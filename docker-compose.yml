services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"    # internal Docker network
      - "29092:29092"  # external host machine
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Kafka listens on two addresses:
      # - kafka:9092 for Docker containers
      # - localhost:29092 for your Windows/Git Bash Python producer
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Local single-broker settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: airflow-webserver
    restart: always
    depends_on:
      airflow-scheduler:
        condition: service_started
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy
    env_file:
    - .env
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - _PIP_ADDITIONAL_REQUIREMENTS=kafka-python boto3 snowflake-connector-python dbt-core dbt-snowflake python-dotenv requests
      - DBT_PROFILES_DIR=/opt/airflow/finnhub_stocks
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./producer:/opt/airflow/producer
      - ./consumer:/opt/airflow/consumer
      - ./finnhub_stocks:/opt/airflow/finnhub_stocks
      - ./sql:/opt/airflow/sql
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: airflow-scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - _PIP_ADDITIONAL_REQUIREMENTS=kafka-python boto3 snowflake-connector-python dbt-core dbt-snowflake python-dotenv requests
      - DBT_PROFILES_DIR=/opt/airflow/finnhub_stocks
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./producer:/opt/airflow/producer
      - ./consumer:/opt/airflow/consumer
      - ./finnhub_stocks:/opt/airflow/finnhub_stocks
      - ./sql:/opt/airflow/sql
    command: scheduler

  postgres:
    image: postgres:15
    container_name: airflow-postgres
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"


  timescaledb:
    # Official TimescaleDB image pinned to TimescaleDB 2.17.2 on PostgreSQL 16.
    image: timescale/timescaledb:2.17.2-pg16
    container_name: finnhub-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TIMESCALEDB_DATABASE:-finnhub_stocks_mds}
      POSTGRES_USER: ${TIMESCALEDB_ADMIN_USER}
      POSTGRES_PASSWORD: ${TIMESCALEDB_ADMIN_PASSWORD}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./sql/timescaledb-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${TIMESCALEDB_HOST_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TIMESCALEDB_ADMIN_USER} -d ${TIMESCALEDB_DATABASE:-finnhub_stocks_mds}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  timescaledb_data: